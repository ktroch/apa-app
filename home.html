<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APA Zurich - Inicio</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Forzamos que las tarjetas de admin tengan un estilo visual sutilmente distinto si quieres */
        .admin-only { border: 1px solid rgba(26, 58, 109, 0.1); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <span style="font-weight: bold; letter-spacing: 1px;">APA ZÜRICH</span>
            <button onclick="logout()" style="width: auto; margin: 0; padding: 6px 12px; background: var(--rojo-apa); font-size: 0.75rem; border-radius: 5px; color: white; border: none;">SALIR</button>
        </div>

        <div class="welcome-section">
            <p style="color: var(--gris-texto); font-size: 0.9rem; margin-bottom: 5px;">Bienvenido/a,</p>
            <h1 class="welcome-msg" id="user-welcome">Cargando...</h1>
        </div>

        <div class="menu-grid">
            <div class="menu-card" onclick="navegar('registro')">
                <span>📝</span> Nuevo Registro
            </div>
            <div class="menu-card" onclick="navegar('directorio')">
                <span>📇</span> Directorio
            </div>
            <div class="menu-card" onclick="navegar('scanner')">
                <span>🔍</span> Lector QR
            </div>
            <div class="menu-card" onclick="navegar('ajustes')">
                <span>⚙️</span> Ajustes
            </div>

            <div class="menu-card admin-only" onclick="navegar('usuarios')" style="display: none;">
                <span>👥</span> Usuarios
            </div>
            <div class="menu-card admin-only" onclick="navegar('reportes')" style="display: none;">
                <span>📊</span> Reportes
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userName = sessionStorage.getItem('user_name') || "Usuario";
            const userRole = sessionStorage.getItem('user_role');
            
            // 1. Mostrar nombre real
            document.getElementById('user-welcome').innerText = userName;

            // 2. Lógica de Admin: Si el rol es 'Admin', mostramos las tarjetas ocultas
            if (userRole === 'Admin') {
                const adminCards = document.querySelectorAll('.admin-only');
                adminCards.forEach(card => {
                    card.style.display = 'flex'; // Cambiamos de none a flex para que mantenga el diseño
                });
            }
        });

        function navegar(destino) {
            const paginas = {
                'registro': 'registro.html',
                'directorio': 'directorio.html',
                'scanner': 'directorio.html' // El scanner suele estar integrado en el directorio
            };

            if (paginas[destino]) {
                window.location.href = paginas[destino];
            } else {
                alert("Módulo de " + destino + " (exclusivo Admin) bajo mantenimiento.");
            }
        }

        function logout() {
            sessionStorage.clear();
            localStorage.removeItem('apa_session');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
