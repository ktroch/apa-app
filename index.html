<!DOCTYPE html>
<html lang="es">
<head>

    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }

        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0077b3; }
        .error { color: red; font-size: 0.8em; display: none; }
    </style>
</head>

</html>
