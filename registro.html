<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APA Zurich - Formulario</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .form-body { padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .photo-box { 
            width: 100%; height: 180px; border: 2px dashed var(--azul-apa); 
            border-radius: 10px; display: flex; justify-content: center; 
            align-items: center; background: #f9f9f9; overflow: hidden;
        }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        label { display: block; margin-top: 5px; font-weight: bold; color: var(--azul-apa); }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .btn-primario { background: var(--azul-apa); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-primario:disabled { background: #ccc; }
    </style>
</head>
<body>

    <div class="header-detalle">
        <button class="back-btn" onclick="window.history.back()">‹</button>
        <h2 class="title-center" id="form-title">REGISTRO DE MIEMBRO</h2>
    </div>

    <div class="form-body">
        <div class="photo-box" onclick="document.getElementById('input-foto').click()">
            <img id="preview-foto" src="" style="display:none;">
            <span id="txt-foto">Click para (re)tomar foto</span>
        </div>
        <input type="file" id="input-foto" accept="image/*" capture="environment" style="display:none;" onchange="procesarFoto(event)">

        <label>Nombre</label>
        <input type="text" id="nombre" placeholder="Ej: Juan">

        <label>Apellido</label>
        <input type="text" id="apellido" placeholder="Ej: Pérez">

        <label>Rol / Categoría</label>
        <select id="rol">
            <option value="Socio">Socio</option>
            <option value="Directivo">Directivo</option>
            <option value="Colaborador">Colaborador</option>
        </select>

        <label>Teléfono</label>
        <input type="tel" id="telefono" placeholder="+41 00 000 00 00">

        <label>Email</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com">

        <label>Dirección</label>
        <input type="text" id="direccion" placeholder="Calle, Número, Ciudad">

        <label>Tipo de Documento</label>
        <select id="tipo_doc">
            <option value="ID">ID Card / Cédula</option>
            <option value="Pasaporte">Pasaporte</option>
            <option value="Permiso">Permiso de Residencia</option>
        </select>

        <label>Número de Documento</label>
        <input type="text" id="num_doc" placeholder="Número identificador">

        <button class="btn-primario" id="btn-guardar" onclick="guardarDatos()">GUARDAR REGISTRO</button>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzK8xu3o1Y4gE6NovpF9oJ6EaIMIK224KSbUX75PDOG8i0SLLYonZKTgEWm_e4TJDStdw/exec';
        let photoBase64 = "";
        let esEdicion = false;
        let idMiembroEdicion = "";

        // Al cargar, verificar si venimos a "Modificar"
        window.onload = async function() {
            idMiembroEdicion = localStorage.getItem('selectedMemberId');
            const modo = localStorage.getItem('formMode');

            if (modo === 'edit' && idMiembroEdicion) {
                esEdicion = true;
                document.getElementById('form-title').innerText = "MODIFICAR MIEMBRO";
                document.getElementById('btn-guardar').innerText = "ACTUALIZAR DATOS";
                await precargarDatos(idMiembroEdicion);
            }
        };

        async function precargarDatos(id) {
            try {
                const res = await fetch(`${WEB_APP_URL}?action=obtenerMiembros`);
                const miembros = await res.json();
                const m = miembros.find(item => item.id === id);

                if (m) {
                    document.getElementById('nombre').value = m.nombre;
                    document.getElementById('apellido').value = m.apellido;
                    document.getElementById('rol').value = m.rol || "Socio";
                    document.getElementById('telefono').value = m.telefono;
                    document.getElementById('email').value = m.email || "";
                    document.getElementById('direccion').value = m.direccion || "";
                    document.getElementById('tipo_doc').value = m.tipo_doc || "ID";
                    document.getElementById('num_doc').value = m.num_doc || "";
                    
                    if (m.foto) {
                        const img = document.getElementById('preview-foto');
                        img.src = m.foto;
                        img.style.display = "block";
                        document.getElementById('txt-foto').style.display = "none";
                        photoBase64 = m.foto;
                    }
                }
            } catch (e) { console.error("Error precargando", e); }
        }

        function procesarFoto(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('preview-foto');
                img.src = e.target.result;
                img.style.display = "block";
                document.getElementById('txt-foto').style.display = "none";
                photoBase64 = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function guardarDatos() {
            const btn = document.getElementById('btn-guardar');
            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;

            if (!nombre || !apellido) {
                alert("Nombre y Apellido son obligatorios");
                return;
            }

            btn.disabled = true;
            btn.innerText = "PROCESANDO...";

            const datos = {
                action: esEdicion ? "modificarPersona" : "registrarPersona",
                id: esEdicion ? idMiembroEdicion : null,
                nombre: nombre,
                apellido: apellido,
                rol: document.getElementById('rol').value,
                telefono: document.getElementById('telefono').value,
                email: document.getElementById('email').value,
                direccion: document.getElementById('direccion').value,
                tipo_doc: document.getElementById('tipo_doc').value,
                num_doc: document.getElementById('num_doc').value,
                foto: photoBase64
            };

            try {
                // Importante: El script de Google debe tener la función 'modificarPersona'
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(datos)
                });

                alert(esEdicion ? "¡Actualización exitosa!" : "¡Registro exitoso!");
                localStorage.removeItem('formMode');
                window.location.href = 'home.html';
            } catch (error) {
                console.error("Error:", error);
                alert("Hubo un error. Reintenta.");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
