<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APA Zurich - Inicio</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <span style="font-weight: bold; letter-spacing: 1px;">APA ZÜRICH</span>
            <button onclick="logout()" style="width: auto; margin: 0; padding: 6px 12px; background: var(--rojo-apa); font-size: 0.75rem; border: none; color: white; border-radius: 5px; cursor: pointer;">SALIR</button>
        </div>

        <div class="welcome-section">
            <p style="color: var(--gris-texto); font-size: 0.9rem; margin-bottom: 5px;">Bienvenido/a,</p>
            <h1 class="welcome-msg" id="user-welcome">Cargando...</h1>
        </div>

        <div class="menu-grid">
            <div class="menu-card" onclick="navegar('registro')"><span>📝</span> Registro</div>
            <div class="menu-card" onclick="navegar('directorio')"><span>📁</span> Directorio</div>
            <div class="menu-card" onclick="navegar('asistencia')"><span>📅</span> Asistencia</div>
            <div class="menu-card" onclick="navegar('inventario')"><span>📦</span> Inventario</div>
            <div class="menu-card" onclick="navegar('entregas')"><span>🎁</span> Entregar Kit</div>
            
            <div class="menu-card admin-only" onclick="navegar('usuarios')" style="display: none;"><span>👥</span> Usuarios</div>
            <div class="menu-card admin-only" onclick="navegar('reportes')" style="display: none;"><span>📊</span> Reportes</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userName = sessionStorage.getItem('user_name') || "Usuario";
            const userRole = sessionStorage.getItem('user_role');
            
            // Mostrar el nombre real
            document.getElementById('user-welcome').innerText = userName;

            // Mostrar opciones de Admin solo si el rol es exactamente 'Admin'
            if (userRole === 'Admin') {
                const adminOptions = document.querySelectorAll('.admin-only');
                adminOptions.forEach(el => el.style.display = 'flex');
            }
        });

        function navegar(destino) {
            const paginas = {
                'registro': 'registro.html',
                'directorio': 'directorio.html',
                'asistencia': 'asistencia.html',
                'inventario': 'inventario.html',
                'entregas': 'entregas.html',
                'usuarios': 'usuarios.html',
                'reportes': 'reportes.html'
            };
            if (paginas[destino]) {
                window.location.href = paginas[destino];
            } else {
                alert("Módulo en desarrollo.");
            }
        }

        function logout() {
            sessionStorage.clear();
            localStorage.removeItem('apa_session');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
