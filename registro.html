<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APA Zurich - Registro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Estilos rápidos para forzar el orden vertical */
        .form-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .photo-box { 
            width: 100%; 
            height: 180px; 
            border: 2px dashed var(--azul-apa); 
            border-radius: 10px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #f9f9f9;
            overflow: hidden;
        }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        label { display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Cabecera Real -->
    <div class="header-registro">
        <button class="back-btn" onclick="window.location.href='home.html'">⬅</button>
        <h2 style="margin: 0; font-size: 1.2rem;">NUEVO REGISTRO</h2>
    </div>

    <div class="form-body">
        <!-- Foto -->
        <label>Fotografía</label>
        <div class="photo-box" onclick="document.getElementById('fileInput').click()">
            <span id="photo-placeholder">📸 Tocar para capturar</span>
            <img id="photo-preview" style="display:none;">
        </div>
        <input type="file" id="fileInput" accept="image/*" capture="camera" style="display:none;" onchange="previewPhoto(this)">

        <!-- Inputs -->
        <div>
            <label>Nombre(s)</label>
            <input type="text" id="nombre" placeholder="Ej: Juan">
        </div>

        <div>
            <label>Apellido(s)</label>
            <input type="text" id="apellido" placeholder="Ej: Pérez">
        </div>

        <div>
            <label>Rol</label>
            <select id="rol" style="width:100%; padding:10px; border-radius:8px;">
                <option value="Miembro">Miembro</option>
                <option value="Docente">Docente</option>
                <option value="Colaborador">Colaborador</option>
            </select>
        </div>

        <div>
            <label>Teléfono</label>
            <input type="tel" id="telefono" placeholder="+41...">
        </div>

        <div>
            <label>Email</label>
            <input type="email" id="email" placeholder="ejemplo@correo.com">
        </div>

        <div>
            <label>Dirección (Zürich)</label>
            <input type="text" id="direccion" placeholder="Calle, Número, CP">
        </div>

        <div>
            <label>Documento</label>
            <select id="tipo_doc" style="width:100%; padding:10px; border-radius:8px;">
                <option value="ID">ID Suizo</option>
                <option value="Pasaporte">Pasaporte</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <input type="text" id="num_doc" placeholder="Número de documento">

        <button id="save-btn" onclick="guardarRegistro()" style="margin-top:20px;">GUARDAR REGISTRO</button>
    </div>

    <script src="js/app.js"></script>
    <script>
        let photoBase64 = "";

        function previewPhoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('photo-preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('photo-placeholder').style.display = 'none';
                    photoBase64 = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function guardarRegistro() {
            const btn = document.getElementById('save-btn');
            const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyRAEbz2KMc6lvUX-SX085Autf4OGwRBjP-gVgVSxgGZvL9nn1x3zj0FJxD-iNX-XZyIw/exec'; // Asegúrate de que sea la última

            // Validación básica
            if (!document.getElementById('nombre').value || !photoBase64) {
                alert("El nombre y la foto son obligatorios");
                return;
            }

            btn.disabled = true;
            btn.innerText = "GUARDANDO EN NUBE...";

            const datos = {
            action: "registrarPersona",
            nombre: document.getElementById('nombre').value,
            apellido: document.getElementById('apellido').value,
            rol: document.getElementById('rol').value,
            telefono: document.getElementById('telefono').value,
            email: document.getElementById('email').value, // NUEVO
            direccion: document.getElementById('direccion').value, // NUEVO
            tipo_doc: document.getElementById('tipo_doc').value,
            num_doc: document.getElementById('num_doc').value,
            foto: photoBase64
            };

            try {
                // Usamos la misma técnica que en el login
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    body: JSON.stringify(datos)
                });

                alert("¡Registro exitoso! El miembro ha sido guardado.");
                window.location.href = 'home.html';

            } catch (error) {
                console.error("Error:", error);
                alert("Hubo un error al guardar. Reintenta.");
                btn.disabled = false;
                btn.innerText = "GUARDAR REGISTRO";
            }
        }
    </script>
</body>
</html>
